<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Result</title>
    <style>


        :root {
            --bg: #ffffff;
            --border: #efefef;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --accent: #007bff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }


        .composer {
            margin-bottom: 3rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            resize: none;
            font-family: inherit;
            font-size: 1rem;
            margin-bottom: 10px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #ccc;
        }

        button {
            background: #000;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            float: right;
        }
        </style>
    </head>
    <body>
        <div>
             <h2>Results for: "{{ searched }}"</h2>

{% if results %}
    <ul>
        {% for user_found in results %}
            <li>
                <a href="{% url 'profile' user_found.username %}">
                    {{ user_found.username }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No users found matching that name.</p>
{% endif %}
        </div>
    </body>
</html>
