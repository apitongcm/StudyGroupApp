<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
        :root {
            --bg: #ffffff;
            --border: #e1e1e1;
            --text: #1a1a1a;
            --muted: #737373;
            --accent: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 360px;
        }

        .auth-card h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .auth-card p {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px; 
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fafafa;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0,0,0,0.02);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s active;
        }

        button:active {
            transform: scale(0.98);
        }

        .footer-link {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .footer-link a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-height: 500px) {
            body { align-items: flex-start; }
            .auth-card { margin-top: 2rem; }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1>Join us.</h1>
        <p>Create your account to start sharing.</p>


        <form method="post">
            {% csrf_token %}
            <div class="input-group">
                <input data-testid="tc-register-001" name="username" type="text" placeholder="Choose a username" required autocomplete="username">
            </div>
            <div class="input-group">
                <input data-testid="tc-register-002" name="password" type="password" placeholder="Create a password" required autocomplete="new-password">
            </div>

            {% if messages %}
                {% for message in messages %}
                    <p data-testid="tc-register-004" style="color:red;">{{ message }}</p>
                {% endfor %}
            {% endif %}
            

            <button data-testid="tc-register-003" type="submit">Create Account</button>
        </form>

        <div class="footer-link">
            Already have an account? <a data-testid="tc-register-005" href="/login/">Sign in</a>
        </div>
    </div>

</body>
</html>
