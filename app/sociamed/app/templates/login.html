<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            --bg: #ffffff;
            --border: #e1e1e1;
            --text: #1a1a1a;
            --muted: #737373;
            --accent: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .login-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fafafa;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--muted);
            background: #fff;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .footer-links {
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .footer-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links span {
            color: var(--muted);
        }

     
        @media screen and (max-width: 768px) {
            input { font-size: 16px; } 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Welcome Back</h1>
        


        <form method="post">
            {% csrf_token %}
            <input data-testid="tc-login-001" name="username" placeholder="Username" aria-label="Username" required>
            <input data-testid="tc-login-002"name="password" type="password" placeholder="Password" aria-label="Password" required>
            
            
            {% if messages %}
                {% for message in messages %}
                    <p data-testid="tc-login-004" style="color:red;">{{ message }}</p>
                {% endfor %}
            {% endif %}


            <button data-testid="tc-login-003" type="submit">Login</button>
        </form>




        <div class="footer-links">
            <span>Don't have an account?</span> 
            <a data-testid="tc-login-005" href="/register/">Register</a>
        </div>


    </div>

</body>
</html>
